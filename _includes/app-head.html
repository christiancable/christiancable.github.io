<head>  
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta charset="utf-8">
    {% comment %} An app's head: titled and described as the app, not the site. {% endcomment %}
    <title>{{ page.app }}: {{ page.title }}</title> 
    <meta name="description" content="{{ page.description | default: page.title }}">
    <link rel="canonical" href="{{ page.url | replace:'index.html','' | prepend: site.baseurl | prepend: site.url }}">
    <link type="text/css" rel="stylesheet" href="{{ "/css/app.css" | prepend: site.baseurl }}">
    <meta name="color-scheme" content="light dark">
</head>
